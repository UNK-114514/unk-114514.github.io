<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        @keyframes button {
            100% {
                transform: scale(1.1);
            }
        }

        body {
            font-size: large;
            background: linear-gradient(to right, lightsalmon, lightblue);
        }

        .main {
            background: whitesmoke;
            width: 98%;
            height: 500px;
            margin-left: 1%;
            padding-top: 20px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 50px;
            line-height: 3px;
            box-sizing: border-box;
        }
        
        .btn {
            font-size: large;
            border-radius: 7px;
            border-color:darkgrey;
            border-style: solid;
            height: 50px;
            width: 150px;
            font-size: 20px;
        }

        .btn:hover {
            animation: button 0.3s ease-in-out forwards;
        }

    </style>
</head>
<body>
    <div class="main">
        <p style="margin-top: 40px; box-sizing: border-box; margin-left: 20px; font-size: 80px; font-weight: 900;">Hello</p>
        <button class="btn" style="margin-left: 20px;" onclick="window.open('https://github.com/UNK-114514/')">
            My Projects
        </button>
        <button class="btn" onclick="window.open('./index.html')">
            About Me
        </button>
    </div>
</body>
</html>
